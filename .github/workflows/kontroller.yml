# Her gönderimde: JavaScript sözdizimi, önbellek adı (sw.js) ve adres taşıma tarayıcı testi.
name: Kontroller
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kontrol:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript sözdizimi
        run: for f in *.js tools/*.mjs; do node --check "$f"; done
      - name: Önbellek adı (sw.js) güncel mi
        run: node tools/sw-kontrol.mjs "${{ github.event.before || github.event.pull_request.base.sha }}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Playwright kur
        run: pip install playwright==1.*
      - name: Adres taşıma ve kayıtların korunması (Chrome)
        run: python3 tests/tasima_test.py "$(which google-chrome)"
