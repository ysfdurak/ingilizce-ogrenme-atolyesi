name: Import English learning app
on:
  push:
    branches: [main]
    paths: [.github/workflows/import-english-app.yml]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Import and verify the source tree
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          source_dir="$RUNNER_TEMP/portfolio-source"
          export IMPORT_DIR="$RUNNER_TEMP/independent-source"
          git clone -q --no-tags https://github.com/ysfdurak/ysfdurak.github.io.git "$source_dir"
          git init -q -b main "$IMPORT_DIR"
          git -C "$IMPORT_DIR" config user.name 'github-actions[bot]'
          git -C "$IMPORT_DIR" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for source_spec in f2ba0b211c1bbc9ce0275819686f42a4ed1cfc92:kelime-atolyesi ad57a6299adbea48e1411030f62bc724ff02d086:dilkusu; do
            source_commit="${source_spec%:*}"
            git -C "$IMPORT_DIR" rm -r --ignore-unmatch . >/dev/null
            git -C "$source_dir" archive "$source_spec" | tar -xf - -C "$IMPORT_DIR"
            git -C "$IMPORT_DIR" add -A
            git -C "$source_dir" show -s --format=%B "$source_commit" |
              GIT_AUTHOR_NAME="$(git -C "$source_dir" show -s --format=%an "$source_commit")"     GIT_AUTHOR_EMAIL="$(git -C "$source_dir" show -s --format=%ae "$source_commit")"     GIT_AUTHOR_DATE="$(git -C "$source_dir" show -s --format=%aI "$source_commit")"     git -C "$IMPORT_DIR" commit -q -F -
          done

          python3 - <<'PYTHON'
          from pathlib import Path
          from base64 import b64decode
          from gzip import decompress
          import os

          project = Path(os.environ["IMPORT_DIR"])
          suffixes = {".html", ".js", ".md", ".webmanifest", ".xml"}
          changes = [('Dilkuşu', 'İngilizce Öğrenme Atölyesi'), ('https://ysfdurak.github.io/dilkusu/', 'https://ysfdurak.github.io/ingilizce-ogrenme-atolyesi/'), ('github.com/ysfdurak/ysfdurak.github.io/issues/new', 'github.com/ysfdurak/ingilizce-ogrenme-atolyesi/issues/new'), ('dilkusu-yedek-', 'ingilizce-ogrenme-atolyesi-yedek-'), ('dilkusu-v1', 'ingilizce-ogrenme-atolyesi-v1')]
          for path in project.rglob("*"):
              if path.is_file() and path.suffix in suffixes and not path.relative_to(project).parts[0] in {".git", "vendor"}:
                  text = path.read_text(encoding="utf-8")
                  for old, new in changes:
                      text = text.replace(old, new)
                  path.write_text(text, encoding="utf-8")

          overrides = {
            "README.md": "",
            "apple-touch-icon.png": "",
            "favicon.svg": "H4sIAAAAAAACA0VPy27DIBC85ytW23MC2E4cVcaH3vsRDgaDQsHCNKR/33We0kozGs3uzHbLZYLrjw+LRJvz/MlYKWVX6l1ME6s454wcCBeny1e8SuTA4dDQYN8lrTIUN2YrkQSw2k0233kir9gjGOe9xI+K10MzIuu7ecgWRonf4giVsJVYSU3kuJJG2PdWiEEjLDnFs6YbxphWm6ewfQTvX4J3Qathlpjib7hlKZeU16CoS1MjqD9CQd0IXs3M4aTadnWvn/abf7brs4kSAQAA",
            "icon-192.png": "",
            "icon-512-maskable.png": "",
            "icon-512.png": "",
            "index.html": "",
            "manifest.webmanifest": "",
            "og.png": "",
            "sitemap.xml": "",
            "tanitim/index.html": ""
          }
          for name, content in overrides.items():
              path = project / name
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(decompress(b64decode(content)))
          PYTHON

          git -C "$IMPORT_DIR" add -A
          actual="$(git -C "$IMPORT_DIR" write-tree)"
          test "$actual" = "f9e329c2af7c08bddec3c423a89e31988a6756a0"
          git -C "$IMPORT_DIR" commit -qm 'İngilizce Öğrenme Atölyesi projesini bağımsız yayına hazırla'
          publish_dir="$RUNNER_TEMP/publish"
          git clone -q "https://github.com/${GITHUB_REPOSITORY}.git" "$publish_dir"
          git -C "$publish_dir" config user.name 'github-actions[bot]'
          git -C "$publish_dir" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$publish_dir" fetch -q "$IMPORT_DIR" main
          git -C "$publish_dir" merge -q --allow-unrelated-histories --no-ff FETCH_HEAD -m 'İngilizce öğrenme uygulamasını portföy deposundan taşı'
          GIT_TERMINAL_PROMPT=0 git -C "$publish_dir"   -c 'credential.helper=!f() { printf "username=x-access-token\npassword=%s\n" "$GH_TOKEN"; }; f'   push origin HEAD:main
